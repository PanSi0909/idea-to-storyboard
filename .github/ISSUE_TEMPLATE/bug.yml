name: 安装或运行问题
description: 报告 Skill 无法安装、发现、调用或完成流程的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 提交前请删除文档链接、令牌、私人联系方式和未授权内容。
  - type: dropdown
    id: environment
    attributes:
      label: 使用环境
      options:
        - Codex 桌面版
        - Codex CLI
        - Codex IDE 扩展
        - 其他 Agent Skills 工具
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用或 CLI 版本
      placeholder: 例如 Codex 版本号；不知道可填“不清楚”
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从安装或输入的第一步开始，按顺序描述。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果和错误信息
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除访问令牌、私人链接、联系方式和未授权内容。
          required: true
