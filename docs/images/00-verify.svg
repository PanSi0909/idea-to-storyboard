<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">确认 Skill 安装成功</title>
  <desc id="desc">使用 skills 命令查找并选择一键式短片分镜。</desc>
  <rect width="1200" height="630" rx="32" fill="#f1f5fa"/>
  <text x="70" y="78" fill="#176f63" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">图片教程 2 / 6</text>
  <text x="70" y="138" fill="#14243b" font-size="44" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">确认安装成功，再开始创作</text>
  <rect x="70" y="190" width="1060" height="315" rx="24" fill="#fff" stroke="#bdcadb"/>
  <rect x="108" y="225" width="984" height="65" rx="14" fill="#eef3f8"/>
  <text x="140" y="267" fill="#233a58" font-size="28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/skills</text>
  <text x="108" y="340" fill="#65768c" font-size="22" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">已安装的 Skills</text>
  <rect x="108" y="366" width="984" height="98" rx="16" fill="#e3f4f0" stroke="#168779" stroke-width="2"/>
  <circle cx="158" cy="415" r="23" fill="#168779"/>
  <text x="196" y="408" fill="#14243b" font-size="27" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">一键式短片分镜</text>
  <text x="196" y="442" fill="#4f657e" font-size="21" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">$idea-to-storyboard</text>
  <text x="70" y="567" fill="#405775" font-size="25" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">找不到时：新开一个对话；仍未出现再重启 Codex</text>
</svg>
