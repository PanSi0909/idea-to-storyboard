  <rect x="64" y="502" width="1072" height="70" rx="18" fill="#ffd166"/>
  <text x="109" y="548" fill="#342600" font-size="27" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">发现冲突：先指出问题；涉及核心五项：先征得确认。</text>
