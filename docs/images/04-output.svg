<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">分镜输出与同步</title><desc id="desc">输出八列分镜表，完成四项验收，外部写入前取得明确授权。</desc>
  <rect width="1200" height="630" rx="32" fill="#f7f2ea"/>
  <text x="64" y="82" fill="#a45235" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">图片教程 4 / 4</text>
  <text x="64" y="140" fill="#2f241f" font-size="44" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">得到能拍、能检查、能留痕的分镜</text>
  <rect x="64" y="190" width="1072" height="166" rx="20" fill="#fff" stroke="#d5c7b9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" fill="#493b33">
    <text x="92" y="236">镜号</text><text x="184" y="236">时间／时长</text><text x="329" y="236">场景</text><text x="410" y="236">单一情绪任务</text><text x="579" y="236">画面动作</text><text x="700" y="236">景别／机位／运镜</text><text x="883" y="236">声音／台词</text><text x="1012" y="236">功能</text>
    <line x1="86" y1="254" x2="1112" y2="254" stroke="#d5c7b9"/>
    <text x="92" y="298">18</text><text x="184" y="298">125—135 / 10秒</text><text x="329" y="298">公寓</text><text x="410" y="298">亲自承担关系</text><text x="579" y="298">关闭代理，发送“等我”</text><text x="883" y="298">呼吸、雨声</text><text x="1012" y="298" fill="#a45235">英雄镜头</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <text x="64" y="414" fill="#2f241f" font-size="28" font-weight="700">验收四问</text>
    <text x="64" y="462" fill="#5f5047" font-size="24">✓ 总时长约150秒　✓ 每20—30秒有新信息</text>
    <text x="64" y="505" fill="#5f5047" font-size="24">✓ 阻碍逐次升级　✓ 英雄镜头后留10—15秒余味</text>
  </g>
  <rect x="64" y="545" width="1072" height="52" rx="16" fill="#2f6f65"/>
  <text x="102" y="579" fill="#fff" font-size="23" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">同步外部文档：先获得明确授权，再用“原文＋修订建议＋最终稿”保留痕迹。</text>
</svg>
